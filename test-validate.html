<!doctype html>
<html>
<body>
<form id="f"><input type="file" name="thumbnail" required><button type="submit">Go</button></form>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
<script>
$(document).ready(function(){
  $("#f").validate({rules:{thumbnail:"required"}});
  var dt=new DataTransfer();
  var b=new Blob(["x"],{type:"image/png"});
  var f=new File([b],"a.png",{type:"image/png"});
  dt.items.add(f);
  document.querySelector('input[name="thumbnail"]').files=dt.files;
  console.log("valid?", $("#f").valid());
});
</script>
</body>
</html>
